services:
  - type: web
    name: ravepass-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
